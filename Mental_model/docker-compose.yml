version: "3.9"
services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - chroma
    volumes:
      - ./:/app
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  chroma:
    image: chromadb/chroma:latest
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - ./chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
